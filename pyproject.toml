[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demonscrest-python"
version = "0.1.0"
description = "Native Python port of the Demon's Crest fan port (raylib)"
requires-python = ">=3.10"
dependencies = ["raylib>=6.0"]

[project.scripts]
demonscrest-py = "dcpy.main:main"

[tool.setuptools]
packages = ["dcpy"]
