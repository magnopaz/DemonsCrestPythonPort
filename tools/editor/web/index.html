<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demon's Crest · Content Toolkit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0e12'/%3E%3Cpath d='M6 24V9l5 4 5-7 5 7 5-4v15' fill='none' stroke='%23e0a13c' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/web/css/editor.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <path d="M5 33V9l8 6 7-11 7 11 8-6v24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M14 26h12M17 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">DEMON'S CREST</div>
          <div class="brand-sub">CONTENT TOOLKIT</div>
        </div>
      </div>
      <nav id="main-nav" aria-label="Editors">
        <button class="nav-tab" data-view="map">
          <span class="nav-icon" data-icon="map"></span><span>Map Builder</span>
        </button>
        <button class="nav-tab" data-view="campaign">
          <span class="nav-icon" data-icon="compass"></span><span>Campaign</span>
        </button>
        <button class="nav-tab" data-view="enemy">
          <span class="nav-icon" data-icon="skull"></span><span>Enemy Editor</span>
        </button>
        <button class="nav-tab" data-view="player">
          <span class="nav-icon" data-icon="player"></span><span>Player Editor</span>
        </button>
        <button class="nav-tab" data-view="dialogue">
          <span class="nav-icon" data-icon="book"></span><span>Dialogue</span>
        </button>
        <button class="nav-tab" data-view="coverage">
          <span class="nav-icon" data-icon="chart"></span><span>Coverage</span>
        </button>
        <button class="nav-tab" data-view="checks">
          <span class="nav-icon" data-icon="clipboard"></span><span>Checks</span>
        </button>
        <button class="nav-tab" data-view="assets">
          <span class="nav-icon" data-icon="image"></span><span>Asset Browser</span>
        </button>
      </nav>
      <div class="topbar-right">
        <span id="project-info" class="project-info"></span>
        <span id="save-state" class="save-state">idle</span>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer id="statusbar">
      <span id="status-left">Loading workspace…</span>
      <span id="status-right"></span>
    </footer>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
    // Surface module-load and runtime errors instead of leaving a blank page.
    (function () {
      function fail(message, detail) {
        var el = document.getElementById("view");
        if (!el) return;
        el.innerHTML = "";
        var box = document.createElement("div");
        box.style.cssText = "padding:48px 28px;max-width:900px;margin:0 auto;color:#d9dce6;line-height:1.6;font-family:Segoe UI,sans-serif";
        box.innerHTML = "<h2 style='color:#e26a6a;margin:0 0 10px'>The editor hit a script error</h2>";
        var p = document.createElement("p");
        p.textContent = message;
        box.appendChild(p);
        if (detail) {
          var pre = document.createElement("pre");
          pre.style.cssText = "white-space:pre-wrap;font-size:11px;color:#9aa0b2;background:#14161d;padding:12px;border:1px solid #2a2e3a;border-radius:4px;overflow:auto";
          pre.textContent = detail;
          box.appendChild(pre);
        }
        el.appendChild(box);
        var status = document.getElementById("status-left");
        if (status) status.textContent = "Script error: " + message;
      }
      window.addEventListener("error", function (event) {
        fail(event.message || "Unknown error",
          (event.filename || "") + ":" + (event.lineno || 0) +
          (event.error && event.error.stack ? "\n\n" + event.error.stack : ""));
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason || {};
        fail(reason.message || String(reason),
          reason.stack || "");
      });
    })();
  </script>
  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
